# Security checks (qa-deploy). Runs on GitHub's runners only; nothing here touches hshi-u1.
#  - secrets: gitleaks (pinned release, checksum-verified) over the FULL history of every pushed ref
#    with .gitleaks.toml (upstream rules + project env-var / private-infra rules), plus the bash
#    fallback scanner over the current tree.
#  - deps: lockfile must be in sync with every package.json (frozen install, no scripts run) and
#    `pnpm audit --prod --audit-level high` must be clean.
# Third-party actions are pinned by full commit SHA (tag in the trailing comment); Dependabot
# (.github/dependabot.yml) proposes updates.
name: security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: new advisories against an unchanged lockfile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (matches the release's checksums.txt and the
      # GitHub release asset digest).
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still public
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$d/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $d/$f" | sha256sum -c -
          tar -xzf "$d/$f" -C "$d" gitleaks
          sudo install -m 0755 "$d/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks — full history, all fetched refs
        run: |
          gitleaks git --config .gitleaks.toml --redact --no-banner -v \
            --log-opts="--all" .

      - name: Fallback scanner — current tree
        run: bash scripts/secret-scan.sh

  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # version comes from "packageManager" in package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Lockfile in sync (frozen install, no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only

      - name: Audit production dependencies (high and above)
        run: pnpm audit --prod --audit-level high

      - name: Audit all dependencies (report only)
        run: pnpm audit || true
