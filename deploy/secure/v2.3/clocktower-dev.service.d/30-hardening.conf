# v2.3 HOST-03 / HOST-06 (sec-host): defence in depth on top of the base unit.
# Apply to dev first and run the smoke test + one full game before prod (docs/security-v2.3/02-host-safety.md, "Needs the user").
[Service]
# HOST-03: no core dumps (apport would write process memory incl. secrets outside the sandbox).
LimitCORE=0
# HOST-06: on top of SystemCallFilter=@system-service (an allow list), remove these groups.
SystemCallFilter=~@privileged @resources @mount @debug @cpu-emulation @obsolete @raw-io @reboot @swap @module @clock
PrivateIPC=yes
DevicePolicy=closed
