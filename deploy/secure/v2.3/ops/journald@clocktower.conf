# v2.3 OPS-7 (sec-ops): own journald namespace for the Clocktower units, so the game's logs have their
# own retention independent of the rest of the host (default journald kept 4+ months, 4 GB shared).
# Install: /etc/systemd/journald@clocktower.conf (deploy/secure/v2.3/ops/apply.sh --apply), plus the
# LogNamespace drop-in on each unit. Read:  journalctl --namespace=clocktower -u clocktower-prod -f
# Policy (user decision 2026-10-16): logs 14 days. They hold account/lobby/seat ids only (no IPs, no names).
[Journal]
Storage=persistent
MaxRetentionSec=14day
SystemMaxUse=512M
SystemMaxFileSize=32M
RateLimitIntervalSec=30s
RateLimitBurst=4000
