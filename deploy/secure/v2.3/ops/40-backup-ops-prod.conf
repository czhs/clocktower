# v2.3 OPS-4 (sec-ops): the backup may write ONLY its status marker next to the DB (shown in the
# admin console as "last backup"), and a failure raises a critical journal entry.
# The marker file must exist (apply.sh creates it owned by the service user, 0600).
[Unit]
OnFailure=clocktower-ops-alert@%n.service
[Service]
ReadWritePaths=-/srv/clocktower/data/prod/.last-backup
